    <section class="principal">
        <div class="carousel">
            <button class="prev">&#10094;</button>

            <div class="carousel-images">
                <img src="https://imgv2-1-f.scribdassets.com/img/word_document/586282408/original/216x287/07b7319564/1754156211?v=1" class="active">
                <img src="https://m.media-amazon.com/images/I/81dsme++-oL._AC_UF1000,1000_QL80_.jpg">
                <img src="https://imagessl4.casadellibro.com/a/l/s5/84/9788467036084.webp">
            </div>


            <button class="next">&#10095;</button>
        </div>
        <script>
            let index = 0;
            const images = document.querySelectorAll(".carousel-images img");

            function showImage(i) {
                images.forEach(img => img.classList.remove("active"));
                images[i].classList.add("active");
            }

            document.querySelector(".next").onclick = () => {
                index = (index + 1) % images.length;
                showImage(index);
            };

            document.querySelector(".prev").onclick = () => {
                index = (index - 1 + images.length) % images.length;
                showImage(index);
            };
            setInterval(() => {
                index = (index + 1) % images.length;
                showImage(index);
            }, 5000);
        </script>
        <style>
            .carousel {
                width: 400px;
                position: relative;
                margin: auto;
                overflow: hidden;
            }

            .carousel-images img {
                width: 400px;
                height: 400px;
                display: none;
            }

            .carousel-images img.active {
                display: block;
            }

            button.prev,
            button.next {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(0, 0, 0, 0.5);
                color: white;
                border: none;
                font-size: 24px;
                cursor: pointer;
                padding: 8px;
            }

            .prev {
                left: 10px;
            }

            .next {
                right: 10px;
            }
        </style>
